<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Ledger</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --text: #1f2328; --muted: #5f6670;
    --accent: #2f6f5e; --accent-soft: #e3efe9; --warn: #9a5b13; --warn-soft: #fbefdc;
    --border: #e2e0da; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); font-size: 16px; }
  header { background: var(--surface); border-bottom: 1px solid var(--border);
           padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 20px; margin: 0; color: var(--accent); }
  nav button { background: none; border: 0; font-size: 15px; padding: 8px 14px; border-radius: 8px;
               cursor: pointer; color: var(--muted); }
  nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { max-width: 960px; margin: 28px auto; padding: 0 32px; }
  h2 { font-size: 22px; margin: 0 0 18px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .stat .label { color: var(--muted); font-size: 14px; }
  .stat .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .stat.warn .value { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 14px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .badge.paid { background: var(--accent-soft); color: var(--accent); }
  .badge.pending { background: var(--warn-soft); color: var(--warn); }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px;
         font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  form.stack { display: grid; gap: 14px; max-width: 420px; }
  label { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
  input, select { font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
  .login { max-width: 400px; margin: 90px auto; }
  .login h1 { color: var(--accent); margin: 0 0 6px; }
  .login p { color: var(--muted); margin: 0 0 22px; }
  .toast { position: fixed; top: 20px; right: 20px; background: var(--accent); color: #fff;
           padding: 12px 18px; border-radius: 8px; font-weight: 600; display: none; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<section id="login" class="login card">
  <h1>Lesson Ledger</h1>
  <p>Your lessons and your payments, in one place.</p>
  <form id="login-form" class="stack">
    <label>Email <input id="email" type="email" autocomplete="username" required></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Log in</button>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <h1>Lesson Ledger</h1>
    <nav>
      <button data-view="summary" class="active">Summary</button>
      <button data-view="new">Record lesson</button>
      <button data-view="pending">Pending payments</button>
    </nav>
  </header>
  <main>
    <section id="view-summary">
      <h2>November summary</h2>
      <div class="grid">
        <div class="card stat"><div class="label">Lessons given</div><div class="value" id="s-lessons"></div></div>
        <div class="card stat"><div class="label">Collected</div><div class="value" id="s-collected"></div></div>
        <div class="card stat warn"><div class="label">Pending</div><div class="value" id="s-pending"></div></div>
      </div>
      <div class="card">
        <table><thead><tr><th>Date</th><th>Student</th><th>Duration</th><th>Price</th><th>Status</th></tr></thead>
          <tbody id="t-lessons"></tbody></table>
      </div>
    </section>

    <section id="view-new" class="hidden">
      <h2>Record lesson</h2>
      <div class="card">
        <form id="lesson-form" class="stack">
          <label>Student <select id="f-student"></select></label>
          <label>Date <input id="f-date" type="date" required></label>
          <label>Duration (minutes) <input id="f-duration" type="number" value="60" min="15" step="15" required></label>
          <label>Price ($) <input id="f-price" type="number" value="30" min="0" step="1" required></label>
          <button class="btn" type="submit">Save lesson</button>
        </form>
      </div>
    </section>

    <section id="view-pending" class="hidden">
      <h2>Pending payments</h2>
      <div class="card">
        <table><thead><tr><th>Student</th><th>Date</th><th>Price</th><th></th></tr></thead>
          <tbody id="t-pending"></tbody></table>
      </div>
    </section>
  </main>
</div>

<script>
  const STUDENTS = ["Emma Clarke (piano)", "Liam Brooks (guitar)", "Sofia Reyes (violin)", "Noah Patel (piano)"];
  const SEED = [
    { date: "2026-11-03", student: STUDENTS[0], duration: 60, price: 30, paid: true },
    { date: "2026-11-04", student: STUDENTS[1], duration: 45, price: 25, paid: true },
    { date: "2026-11-06", student: STUDENTS[2], duration: 60, price: 30, paid: false },
    { date: "2026-11-10", student: STUDENTS[0], duration: 60, price: 30, paid: true },
    { date: "2026-11-11", student: STUDENTS[3], duration: 60, price: 30, paid: false },
  ];
  const STORE = "lesson-ledger:lessons";
  let lessons = JSON.parse(localStorage.getItem(STORE) || "null") || SEED.slice();
  const save = () => localStorage.setItem(STORE, JSON.stringify(lessons));
  const usd = n => n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  const fmt = d => new Date(d + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });

  function toast(msg) {
    const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2200);
  }
  function show(view) {
    document.querySelectorAll("main > section").forEach(s => s.classList.add("hidden"));
    document.getElementById("view-" + view).classList.remove("hidden");
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
    render();
  }
  function render() {
    const sorted = lessons.slice().sort((a, b) => b.date.localeCompare(a.date));
    document.getElementById("s-lessons").textContent = lessons.length;
    document.getElementById("s-collected").textContent = usd(lessons.filter(l => l.paid).reduce((s, l) => s + l.price, 0));
    document.getElementById("s-pending").textContent = usd(lessons.filter(l => !l.paid).reduce((s, l) => s + l.price, 0));
    document.getElementById("t-lessons").innerHTML = sorted.map(l =>
      `<tr><td>${fmt(l.date)}</td><td>${l.student}</td><td>${l.duration} min</td><td>${usd(l.price)}</td>
       <td><span class="badge ${l.paid ? "paid" : "pending"}">${l.paid ? "Paid" : "Pending"}</span></td></tr>`).join("");
    const pending = lessons.map((l, i) => ({ ...l, i })).filter(l => !l.paid);
    document.getElementById("t-pending").innerHTML = pending.length ? pending.map(l =>
      `<tr><td>${l.student}</td><td>${fmt(l.date)}</td><td>${usd(l.price)}</td>
       <td><button class="btn small" data-pay="${l.i}">Mark as paid</button></td></tr>`).join("")
      : `<tr><td colspan="4">No pending payments.</td></tr>`;
  }

  document.getElementById("login-form").addEventListener("submit", e => {
    e.preventDefault();
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    render();
  });
  document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));
  document.getElementById("f-student").innerHTML = STUDENTS.map(s => `<option>${s}</option>`).join("");
  document.getElementById("f-date").value = "2026-11-14";
  document.getElementById("lesson-form").addEventListener("submit", e => {
    e.preventDefault();
    lessons.push({
      date: document.getElementById("f-date").value,
      student: document.getElementById("f-student").value,
      duration: +document.getElementById("f-duration").value,
      price: +document.getElementById("f-price").value,
      paid: false,
    });
    save(); toast("Lesson saved"); show("summary");
  });
  document.getElementById("t-pending").addEventListener("click", e => {
    const i = e.target.dataset.pay; if (i === undefined) return;
    lessons[i].paid = true; save(); toast("Payment recorded"); render();
  });
</script>
</body>
</html>
